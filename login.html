<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sweetora - Login</title>
    <link rel="stylesheet" href="./css/style.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="./css/login.css">
</head>
<body>
    <div class="container">
        <div class="hero-section">
            <div class="hero-text">
                <h1>Freshly Baked Happiness</h1>
            </div>
        </div>

        <div class="login-section">
            <div class="login-box">
                <div class="logo">
                    <img src="https://cdn-icons-png.flaticon.com/512/992/992717.png" alt="Cake Logo">
                    <h2>Sweetora Cakes</h2>
                    <p>Login to enjoy delicious moments</p>
                </div>

                <form id="loginForm">
                    <div class="input-group">
                        <i class='bx bxs-envelope'></i>
        <input type="email" id="email" placeholder="Email Address" required>
    </div>

    <div class="input-group">
        <i class='bx bxs-lock-alt'></i>
        <input type="password" id="password" placeholder="Password" required>
    </div>

    <!-- 🔥 NEW (optional role display) -->
    <input type="hidden" id="role">

    <div class="form-options">
        <label><input type="checkbox"> Remember Me</label>
        <a href="#" class="forgot">Forgot Password?</a>
    </div>

    <button type="submit" class="btn-login">LOGIN</button>
</form>

                <p class="signup-text">Don't have an account? <a href="./signup.html">Sign Up</a></p>
            </div>
        </div>
    </div>

    <!-- <script src="./script/script.js"></script> -->
    <script src="./script/login.js"></script>
</body>
</html>
