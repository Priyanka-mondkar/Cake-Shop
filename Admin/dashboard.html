<!---- main ---->
<div class="main">

<h1>Admin Dashboard</h1>

<div class="cards">

<!-- Revenue -->
<div class="card">
<div class="card-info">
<h3>Revenue</h3>
<p id="revenue">0</p>
<span class="green">+20%</span>
</div>

<div class="progress-circle orange">
<span>80%</span>
</div>
</div>

<!-- Users -->
<div class="card">
<div class="card-info">
<h3>Users</h3>
<p id="users">0</p>
<span class="green">+12%</span>
</div>

<div class="progress-circle blue">
<span>60%</span>
</div>
</div>

<!-- Products -->
<div class="card">
<div class="card-info">
<h3>Products</h3>
<p id="products">0</p>
<span class="green">+8%</span>
</div>

<div class="progress-circle green-circle">
<span>75%</span>
</div>
</div>

<!-- Orders -->
<div class="card">
<div class="card-info">
<h3>Orders</h3>
<p id="orders">0</p>
<span class="red">-5%</span>
</div>

<div class="progress-circle red-circle">
<span>50%</span>
</div>
</div>

</div>

<!-- 🔥 CHART (correct place)
<canvas id="barChart" style="margin-top:30px;"></canvas> -->

    <canvas id="barChart"></canvas>
</div>
