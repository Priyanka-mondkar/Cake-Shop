<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sweetora - Sign Up</title>
    <link rel="stylesheet" href="style.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="./css/signup.css">
</head>
<body>
    <div class="container">
        <div class="hero-section">
            <div class="hero-text">
                <h1>Join the<br><span>Sweet Side!</span></h1>
            </div>
        </div>

        <div class="form-section">
            <div class="form-box">
                <div class="logo">
                    <img src="https://cdn-icons-png.flaticon.com/512/992/992717.png" alt="Cake Icon">
                    <h2 class="brand-name">Sweetora Cakes</h2>
                    <p class="subtitle">Create an account to enjoy fresh treats</p>
                </div>

                <form id="signupForm">
                    <div class="input-group">
                        <i class='bx bx-user'></i>
                        <input type="text" id="fullname" placeholder="Full Name" required>
                    </div>

                    <div class="input-group">
                        <i class='bx bx-envelope'></i>
                        <input type="email" id="email" placeholder="Email Address" required>
                    </div>

                    <div class="input-group">
                        <i class='bx bx-lock-alt'></i>
                        <input type="password" id="password" placeholder="Password" required>
                    </div>

                    <div class="input-group">
                        <i class='bx bx-lock-alt'></i>
                        <input type="password" id="confirmPassword" placeholder="Confirm Password" required>
                    </div>

                    <button type="submit" class="btn-primary">SIGN UP</button>
                </form>

                <p class="footer-text">Already have an account? <a href="login.html">Login</a></p>
            </div>
        </div>
    </div>
    <!-- <script src="./script/script.js"></script> -->
     <script src="./script/signup.js"></script>
</body>
</html>
